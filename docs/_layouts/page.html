---
layout: default
---

<!-- Page Header -->
{% assign header_background = page.background | default: site.cover %}
{% if header_background %}
<header class="masthead masthead-page" style="background-image: url('{{ header_background | relative_url }}')">
  {% else %}
  <header class="masthead masthead-page">
    {% endif %}
    <div class="overlay"></div>
    <div class="container">
      <div class="row">
        <div class="col-lg-10 col-md-11 mx-auto">
          <div class="page-heading">
            <h1>{{ page.title }}</h1>
            {% if page.description %}
            <span class="subheading">{{ page.description }}</span>
            {% endif %}
          </div>
        </div>
      </div>
    </div>
  </header>

  <div class="container">
    <div class="row">
      <div class="col-lg-10 col-md-11 mx-auto">

        {{ content }}

      </div>
    </div>
  </div>
