<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ site.description }}">
    <style>
      :root {
        --bg: #f4f6fb;
        --surface: #ffffff;
        --text: #1f2937;
        --muted: #6b7280;
        --accent: #1d4ed8;
        --border: #d8e0ef;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        background: linear-gradient(180deg, #eef2ff 0, var(--bg) 180px);
        color: var(--text);
        line-height: 1.75;
      }
      a { color: var(--accent); }
      .wrap { max-width: 860px; margin: 0 auto; padding: 32px 20px 64px; }
      header { margin-bottom: 28px; }
      header h1 { margin: 0; font-size: clamp(2.1rem, 4vw, 3.4rem); }
      header p { margin: 8px 0 0; color: var(--muted); }
      nav { margin-top: 14px; }
      nav a { text-decoration: none; }
      main {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 18px;
        padding: 30px;
        box-shadow: 0 18px 45px rgba(15, 23, 42, 0.06);
      }
      h1, h2, h3, h4 { line-height: 1.25; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      img { max-width: 100%; height: auto; border-radius: 10px; }
      figure { margin: 1.5rem 0; }
      pre {
        overflow-x: auto;
        padding: 16px;
        background: #0f172a;
        color: #e5e7eb;
        border-radius: 12px;
      }
      code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      blockquote {
        margin: 1.5rem 0;
        padding: 0.25rem 1rem;
        border-left: 4px solid var(--border);
        color: var(--muted);
      }
      table { width: 100%; border-collapse: collapse; margin: 1.5rem 0; display: block; overflow-x: auto; }
      th, td { border: 1px solid var(--border); padding: 0.75rem; text-align: left; vertical-align: top; }
      .post-date, .post-list-date { color: var(--muted); font-size: 0.95rem; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1><a href="{{ '/' | relative_url }}" style="text-decoration:none;color:inherit;">{{ site.title }}</a></h1>
        <p>{{ site.description }}</p>
        <nav><a href="{{ '/' | relative_url }}">Home</a></nav>
      </header>
      <main>
        {{ content }}
      </main>
    </div>
  </body>
</html>
